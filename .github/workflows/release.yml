# A tag vX.Y.Z builds the zip and publishes it to CurseForge and to GitHub Releases.
# Release type comes from the tag: "-alpha" -> Alpha, "-beta" -> Beta, otherwise Release.
# Requires the CURSEFORGE secret (a CurseForge API token) and "## X-Curse-Project-ID" in BuffDigger.toc.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the packager writes the changelog from it
      - uses: astral-sh/setup-uv@v6
      # Same command as locally; a failing test publishes nothing. No token in this step's env.
      - name: Smoke test
        run: uv run --no-project -q --with "lupa>=2,<3" python -I tests/run_smoke.py
      - uses: BigWigsMods/packager@v2
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE }} # the repo secret is named CURSEFORGE
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
