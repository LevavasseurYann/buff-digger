# A tag vX.Y.Z builds the zip and publishes it to CurseForge and to GitHub Releases.
# Release type comes from the tag: "-alpha" -> Alpha, "-beta" -> Beta, otherwise Release.
# Requires the CF_API_KEY secret and "## X-Curse-Project-ID" in BuffDigger.toc.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # create the GitHub Release

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the packager writes the changelog from it
      - uses: BigWigsMods/packager@v2
